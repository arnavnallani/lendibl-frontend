<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="description" content="Rent and list items in your community with lendibl's secure rental marketplace" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="lendibl" />

  <body>
    <div id="root">
      <div style="padding: 20px; color: blue; font-family: Arial;">
        Loading lendibl...
      </div>
    </div>
    <script>
      console.log('Base HTML loaded');
      window.addEventListener('error', function(e) {
        console.error('Global error:', e.error);
        document.getElementById('root').innerHTML = '<div style="padding: 20px; color: red;">JavaScript Error: ' + e.error + '</div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
